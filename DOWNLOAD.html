* {
    box-sizing: border-box;

body {
    margin: 0;

    background: #101010;
    color: white;
}

/* NAVBAR */
nav {
    background: #222;
    padding: 20px;
    text-align: center;
    box-shadow: 0 3px 15px #000;
}

nav a {
    color: white;
    text-decoration: none;
    margin: 0 14px;
    font-weight: bold;
}

nav a:hover {
    color: #55ff55;
}

/* HEADER */
.header {
    text-align: center;
    padding: 70px 20px 40px;
    background: linear-gradient(135deg, #111, #1d351d);
}

.header h1 {
    font-size: 50px;
    color: #55ff55;
    text-shadow: 4px 4px #000;
    margin: 0;
}

.header p {
    color: #bbb;
    font-size: 18px;
}

/* DOWNLOAD AREA */
.downloads {
    max-width: 1100px;
    margin: auto;
    padding: 50px 25px;
}

.download-card {
    background: #202020;
    border: 2px solid #333;
    border-radius: 15px;
    padding: 25px;
    margin-bottom: 25px;

    display: flex;
    align-items: center;
    justify-content: space-between;

    box-shadow: 0 5px 15px #000;
    transition: 0.25s;
}

.download-card:hover {
    border-color: #55ff55;
    transform: translateY(-5px);
}

.info h2 {
    color: #55ff55;
    margin-top: 0;
}

.info p {
    color: #aaa;
}

/* DOWNLOAD BUTTON */
.download-button {
    display: inline-block;
    background: #55ff55;
    color: #111;
    padding: 14px 28px;
    border-radius: 8px;
    text-decoration: none;
    font-weight: bold;
    white-space: nowrap;
}

.download-button:hover {
    background: white;
    transform: scale(1.05);
}

/* FOOTER */
footer {
    background: #080808;
    text-align: center;
    padding: 30px;
    color: #777;
}

/* MOBILE */
@media (max-width: 700px) {

    .download-card {
        display: block;
        text-align: center;
    }

    .download-button {
        margin-top: 15px;
    }

    .header h1 {
        font-size: 38px;
    }
}
</style>
