<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Kiyan Gamer 94 - Store</title>

<style>

*{
    box-sizing:border-box;
}

body{
    margin:0;
    font-family:Tahoma,Arial,sans-serif;
    background:#050505;
    color:white;
}

/* NAVBAR */

nav{
    background:#111;
    padding:20px;
    text-align:center;
    border-bottom:2px solid #00ff66;
    position:sticky;
    top:0;
    z-index:100;
}

nav a{
    color:white;
    text-decoration:none;
    margin:0 10px;
    font-weight:bold;
}

nav a:hover{
    color:#00ff66;
}

/* HEADER */

.header{
    text-align:center;
    padding:60px 20px 35px;
}

.header h1{
    font-size:45px;
    color:#00ff66;
    margin:0 0 15px;
    text-shadow:0 0 15px #00ff66;
}

.header p{
    color:#aaa;
    font-size:18px;
}

/* PRODUCTS */

.products{
    max-width:1200px;
    margin:auto;
    padding:20px;
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(260px,1fr));
    gap:30px;
}

.product{
    background:#151515;
    border:1px solid #292929;
    border-radius:18px;
    overflow:hidden;
    position:relative;
    transition:.3s;
}

.product:hover{
    transform:translateY(-8px);
    border-color:#00ff66;
    box-shadow:0 0 25px #00ff6640;
}

.product img{
    width:100%;
    height:230px;
    object-fit:cover;
    display:block;
}

.sale{
    position:absolute;
    top:15px;
    right:15px;
    background:#e60000;
    padding:8px 12px;
    border-radius:8px;
    font-weight:bold;
}

.info{
    padding:22px;
}

.info h2{
    color:#00ff66;
    margin-top:0;
}

.info p{
    color:#aaa;
    min-height:45px;
}

.old-price{
    color:#777;
    text-decoration:line-through;
    font-size:17px;
}
